name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o *.zip -d project || true
          find . -maxdepth 3 -name gradlew

      - name: Build APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          elif [ -f project/gradlew ]; then
            cd project
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            echo 'No Android Gradle project found'
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: '**/build/outputs/apk/release/*.apk'
